[package]
name = "openf75"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open-source configurator protocol library for the AULA F75 keyboard"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
