[package]
name = "openf75-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Linha de comando para o teclado AULA F75"

[[bin]]
name = "openf75"
path = "src/main.rs"

[dependencies]
openf75 = { path = "../openf75" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
