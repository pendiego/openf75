name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Installers go to the GitHub Release (free asset storage), not to Actions artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      # tauri-action merges each platform into the same latest.json; parallel jobs would race on it.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.updater.conf.json
          - platform: ubuntu-22.04
            args: --bundles deb,appimage --config src-tauri/tauri.updater.conf.json
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json
    # Free only on a public repo; skipped if it turns private.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev libudev-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: OpenF75 ${{ github.ref_name }}
          # Stays a draft (not /releases/latest) until every platform has uploaded.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: release
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
