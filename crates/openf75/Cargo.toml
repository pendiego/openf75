[package]
name = "openf75"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open-source configurator protocol library for the AULA F75 keyboard"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

# hidraw backend; the build needs libudev development files (pkg-config).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }

# Non-exclusive open, so the keyboard stays usable while another HID client holds it.
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["macos-shared-device"] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
